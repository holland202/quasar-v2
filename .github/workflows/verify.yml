name: verify

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy

      # ------------------------------------------------------------------
      # Self-tests. Each of these runs its own assertions on import/run and
      # exits nonzero on failure -- verified before this workflow was added:
      #   lucid2q.py                        T1-T6, ~7s
      #   backprop.py                       V1-V4, ~2s
      #   quantum_geometric_transformer.py  QGT suites, ~1s
      # The README's "self-tests pass on a cold clone" claim was, until now,
      # checked by nobody but the author on one device. This is that claim,
      # enforced.
      # ------------------------------------------------------------------
      - name: Self-tests (lucid2q T1-T6)
        run: python3 lucid2q.py

      - name: Self-tests (backprop V1-V4)
        run: python3 backprop.py

      - name: Self-tests (QGT suites)
        run: python3 quantum_geometric_transformer.py

      # ------------------------------------------------------------------
      # Anti-vacuity: prove the gate below can actually fail before trusting
      # it when it passes. n2c_check.py --sabotage forces the degenerate-
      # curriculum branch; if that ever exits 0, the gate has stopped
      # working and the clean run beneath it means nothing.
      #
      # This is the same discipline the repo applies to its own findings
      # (F1's vacuity trap, F18's harness bug): an instrument is not
      # trusted until it has been shown capable of returning null.
      # ------------------------------------------------------------------
      - name: Prove the F16 gate can fail
        run: |
          if python3 n2c_check.py --sabotage; then
            echo "GATE IS INERT: sabotaged run exited 0"
            exit 1
          fi
          echo "gate rejects a degenerate curriculum as expected"

      # ------------------------------------------------------------------
      # F16's published claims, enforced. Gates on the published DIRECTIONS,
      # not on "the result looks good": error-proportional is recorded as
      # 8.08% WORSE, 0/5 -- a refutation that must keep passing AS a
      # refutation. See the verdict block in n2c_check.py.
      # ------------------------------------------------------------------
      - name: F16 curriculum claims still hold
        run: python3 n2c_check.py
